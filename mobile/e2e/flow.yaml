appId: com.microitinerary.mobile
---
- launchApp

# 1. Create a Trip
- tapOn: "+"
- inputText: "Kyoto Trip"
- tapOn: "Start Date"
- inputText: "2025-04-01"
- tapOn: "End Date"
- inputText: "2025-04-05"
- tapOn: "Create Trip"

# 2. Verify Trip in List
- assertVisible: "Kyoto Trip"
- assertVisible: "Apr 1, 2025"

# 3. Add Activity
- tapOn: "Kyoto Trip"
- tapOn: "+"
- inputText: "Visit Fushimi Inari"
- tapOn: "Add"
- assertVisible: "Visit Fushimi Inari"

# 4. Add Another Activity (Test Sorting/Dragging setup)
- tapOn: "+"
- inputText: "Lunch at Ramen Street"
- tapOn: "Add"
- assertVisible: "Lunch at Ramen Street"

# 5. Switch Days
- tapOn: "Day 2"
- assertNotVisible: "Visit Fushimi Inari"
- tapOn: "+"
- inputText: "Arashiyama Bamboo Grove"
- tapOn: "Add"
- assertVisible: "Arashiyama Bamboo Grove"
